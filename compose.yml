services:
  nginx:
    build: ./frontend
    container_name: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:5750:8080" # You can change this port if needed.
    depends_on:
      - backend

  backend:
    build: .
    container_name: backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKEND_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000" # You can delete this if you dont need to expose the backend port.
    volumes:
      - ./backend:/app/backend

    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pg_db
    ports:
      - "127.0.0.1:5432:5432" # You can delete this if you dont need to expose the db port, but you can check your database
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
